name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agencypilot
          POSTGRES_PASSWORD: agencypilot
          POSTGRES_DB: agencypilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agencypilot -d agencypilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # No provider keys exist in CI: every LLM call in the tests goes through the fake in
    # tests/fakes.py (conftest.py also overrides the key settings), so nothing can reach a provider.
    env:
      DATABASE_URL: postgresql+psycopg://agencypilot:agencypilot@localhost:5432/agencypilot
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      COPILOT_WARMUP: "false"
      SEED_DEMO_DATA: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # CPU-only torch first: the default Linux wheel pulls ~2 GB of CUDA libraries.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<2.15" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Migrate database
        run: python -m alembic upgrade head

      - name: Models match migrations
        run: python -m alembic check

      - name: Pytest with coverage
        run: python -m pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
