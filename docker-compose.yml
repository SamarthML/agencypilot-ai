services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agencypilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agencypilot
      POSTGRES_PASSWORD: agencypilot
      POSTGRES_DB: agencypilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agencypilot -d agencypilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
